general {
    disable_loading_bar = true
    grace = 0
    hide_cursor = true
}

background {
    monitor =
    # path = screenshot
    path = /home/omori/Pictures/Reddit/anime.jpg
    blur_passes = 3
    blur_size = 4
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.7172
    vibrancy = 0.1696
}

label {
    monitor =
    text = cmd[update:1000] echo "$TIME"
    color = rgba(242, 243, 244, 0.75)
    font_size = 95
    font_family = JetBrains Mono Nerd Font ExtraBold
    position = 0, 200
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %B")"
    color = rgba(242, 243, 244, 0.6)
    font_size = 22
    font_family = JetBrains Mono Nerd Font
    position = 0, 100
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 128, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.15)
    inner_color = rgba(0, 0, 0, 0.2)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    rounding = -1
    check_color = rgb(204, 136, 34)
    fail_color = rgb(204, 34, 34)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    position = 0, -100
    halign = center
    valign = center
}
